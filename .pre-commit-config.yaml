repos:
    - repo: local
      hooks:
        - id: betterleaks
          name: betterleaks
          entry: betterleaks git --pre-commit --staged
          language: system
          pass_filenames: false

        - id: gofmt
          name: gofmt
          entry: gofmt -w .
          language: system
          pass_filenames: false

        - id: govet
          name: go vet
          entry: go vet ./...
          language: system
          pass_filenames: false
        